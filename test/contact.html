    <section id="contact" class="contact-section" aria-labelledby="contact-heading">
      <div>
        <p class="eyebrow">PROFESSIONAL INQUIRIES</p>
        <h2 id="contact-heading">WORK TOGETHER.</h2>
        <p>
          Sponsorships, event hosting, consulting, game-dev / 3D work,
          collaborations, speaking, and project features.
        </p>
      </div>

      <form id="contact-form" class="contact-form" action="#contact" method="post" novalidate>
        <div class="form-grid">
          <label>
            Name
            <input name="name" autocomplete="name" required maxlength="80">
          </label>
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required maxlength="160">
          </label>
        </div>

        <label>
          Company / project
          <input name="company" autocomplete="organization" maxlength="120">
        </label>

        <label>
          What are you reaching out about?
          <select name="topic" required>
            <option value="">Select one</option>
            <option>Sponsorship / promotion</option>
            <option>Event hosting / speaking</option>
            <option>Game dev / 3D / creative work</option>
            <option>Consulting</option>
            <option>Get segmentPreview</option>
            <option>Other professional inquiry</option>
          </select>
        </label>

        <label>
          Message
          <textarea name="message" rows="6" required maxlength="4000"></textarea>
        </label>

        <label class="hp-field" aria-hidden="true">
          Website
          <input name="website" tabindex="-1" autocomplete="off">
        </label>

        <input type="hidden" name="started_at" id="started-at">

        <div class="form-actions">
          <button type="submit">SEND INQUIRY</button>
          <p id="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>THIS IS GAME DEV</span>
    <span>CREATE / LEARN / SHARE / GROW</span>
  </footer>

  <script src="config.js"></script>

</body>
